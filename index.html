<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InAndOnBill">
    <meta name="theme-color" content="#8B5CF6">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>InAndOnBill</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #FFFDF5; overflow: hidden; }
        iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
        .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                font-family: system-ui, sans-serif; color: #64748B; }
    </style>
</head>
<body>
    <div class="boot" id="boot">กำลังเชื่อมต่อระบบ...</div>
    <iframe id="app" src="https://script.google.com/macros/s/AKfycbwrCUiqAlE8P5EJ3iJ4w2aa3AoUgZ0MWYgq8uftNCUu2-aabMWgtyLbFTSK9xnEPzRF/exec" allow="fullscreen" title="InAndOnBill"></iframe>
    <script>
        // wrapper = ตัวเปล่า: แสดงแอป GAS จริงแบบเต็มจอ
        document.getElementById('app').addEventListener('load', function () {
            document.getElementById('boot').style.display = 'none';
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
