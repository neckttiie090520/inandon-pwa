<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InAndOnBill">
    <meta name="theme-color" content="#FFFDF5">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="dns-prefetch" href="https://script.googleusercontent.com">
    <title>InAndOnBill</title>
    <style>
        /* ================================================================
           v8 anchor geometry — ไม่ใช้ตัวเลขความสูงใด ๆ ทั้งสิ้น
           (innerHeight/dvh ของ iOS standalone รายงานเกินโซน home indicator
           บางเครื่อง ส่วน env() = 0 ตรวจไม่ได้ → ทุกสูตรคำนวณพัง)
           วิธีที่พังไม่ได้: ยึด iframe ระหว่างขอบบน+ขอบล่าง viewport
           แล้วให้ browser ยืดเอง — จุดที่ browser วาดขอบล่าง = จุดที่แอปจบ
           ================================================================ */
        :root { --banner-h: 0px; }
        html, body {
            position: fixed;
            inset: 0;
            margin: 0; padding: 0;
            overflow: hidden;
            background: #FFFDF5;
            overscroll-behavior: none;
        }
        /* ตัวเหนือกาว: ยึดขอบบน(เหนือ banner)+ขอบล่าง viewport — div (non-replaced)
           ยืดตาม anchor ได้จริง ส่วน iframe (replaced) ยืดไม่ได้จึงต้องห่อ */
        #frameWrap {
            position: fixed;
            left: 0;
            right: 0;
            top: calc(0px - var(--banner-h));
            bottom: 0;
            overflow: hidden;
        }
        #app {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        .boot {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 18px;
            background: #FFFDF5;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1E293B;
            z-index: 10;
        }
        .boot img { width: 96px; height: 96px; border-radius: 20px; }
        .boot .ring {
            width: 34px; height: 34px;
            border: 3px solid #F5F3FF;
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="boot" id="boot">
        <img src="icons/apple-touch-icon.png" alt="">
        <div class="ring"></div>
        <div>กำลังเชื่อมต่อระบบ...</div>
    </div>
    <div id="frameWrap"><iframe id="app" allow="fullscreen; web-share" title="InAndOnBill"></iframe></div>
    <script>
        var BUILD_ID = 'v13.1-20260829';
        function hideBoot() {
            var boot = document.getElementById('boot');
            if (!boot || boot.dataset.hidden) return;
            boot.dataset.hidden = '1';
            boot.style.transition = 'opacity 0.3s';
            boot.style.opacity = '0';
            setTimeout(function () { boot.style.display = 'none'; }, 300);
        }
        // ยก boot ตอนที่แอปแจ้งว่า lock ขึ้นเรียบร้อยแล้ว (กันแอปแฟลชก่อน lock)
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'inandon-ready') hideBoot();
        });
        // fallback: ถ้าไม่ได้สัญญาณภายใน 12 วิ ให้เข้าแอปเดิม
        setTimeout(hideBoot, 12000);
        document.getElementById('app').addEventListener('load', function () {
            setTimeout(hideBoot, 2500);
        });

        // ================================================================
        // Geometry — หน้า GAS ฝังแถบ "สร้างโดยผู้ใช้ Apps Script" ไว้บนหัว
        // (สูงไม่คงที่) วิธีเดียวที่เสถียร: วัดจากการรายงานของแอป แล้วตั้ง
        // --banner-h ให้ CSS crop ขึ้นเหนือจอ
        // ================================================================
        var GAS_URL = 'https://script.google.com/macros/s/AKfycbwrCUiqAlE8P5EJ3iJ4w2aa3AoUgZ0MWYgq8uftNCUu2-aabMWgtyLbFTSK9xnEPzRF/exec';
        // (ทดลองฝัง userCodeAppPanel ตรงแล้วพัง — Google ไม่ยัด user HTML เว้นแต่
        // parent เป็นหน้า /exec → กลับมาใช้ /exec + cache-bust ตามเดิม)
        var appFrame = document.getElementById('app');
        appFrame.src = GAS_URL + '?cb=' + Date.now();

        var bannerH = 0;      // ความสูงแถบ Google (px) ที่วัดได้
        var rearmUntil = 0;   // ช่วงที่ยอมรับ banner ใหม่ได้อิสระ (resume/หมุนจอ)

        function postToApp(msg) {
            try { appFrame.contentWindow.postMessage(msg, '*'); } catch (e) {}
        }
        function syncVars() {
            document.documentElement.style.setProperty('--banner-h', bannerH + 'px');
        }
        // ความสูงจริง = ค่าที่ browser ยืด iframe ตาม top/bottom anchor — ไม่อ่าน innerHeight/dvh
        function postSize() {
            syncVars();
            var h = appFrame.getBoundingClientRect().height;
            var pr = document.createElement('div');
            pr.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;padding-top:env(safe-area-inset-top);';
            document.body.appendChild(pr);
            var st = Math.round(parseFloat(getComputedStyle(pr).paddingTop) || 0);
            pr.remove();
            postToApp({ type: 'inandon-safe', bottom: 0, height: h, st: st });
        }
        // แอปรายงาน innerHeight ที่มันเห็น → bannerH = ความสูง iframe จริง − ที่แอปเห็น
        window.addEventListener('message', function (e) {
            var d = e.data;
            if (!d) return;
            if (d.type === 'inandon-geom') {
                var ih = parseFloat(d.innerH) || 0;
                var cur = appFrame.getBoundingClientRect().height;
                if (ih > 0 && cur > 0) {
                    var b = Math.max(0, cur - ih);
                    // ยอมรับได้อิสระ: รอบแรก + หลัง resume/หมุนจอ (2 วิ)
                    // ปกติแกว่งได้แค่ ±40px — กันค่าที่โดนคีย์บอร์ดเบียด (100px+)
                    var maxB = (bannerH === 0 || Date.now() < rearmUntil) ? 300 : bannerH + 40;
                    if (Math.abs(b - bannerH) > 1 && b <= maxB) bannerH = b;
                }
                postSize(); // sync กลับทุกครั้ง (ไม่มี loop — app ตั้ง var แล้วไม่เกิด resize ซ้ำ)
            }
            if (d.type === 'inandon-ready') hideBoot();
        });
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) rearmUntil = Date.now() + 2000;
        });
        window.addEventListener('orientationchange', function () {
            setTimeout(function () { rearmUntil = Date.now() + 2000; postSize(); }, 250);
        });
        syncVars();
        postSize();
        window.addEventListener('resize', postSize);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', postSize);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {});
            });
        }
        // ================================================================
        // Auto-update check — ก่อนเข้าแอป (ยังอยู่หลัง boot screen)
        // ดึง shell ล่าสุดจากเน็ต (__upd=1 ให้ SW ข้าม cache) เทียบ BUILD_ID
        // ถ้าต่าง = อัปเดต SW + reload 1 ครั้ง (ผู้ใช้ไม่ต้องติดตั้งใหม่)
        // ================================================================
        (function () {
            if (!window.fetch) return;
            function maybeReload(newId) {
                try {
                    // reload ได้รอบเดียวต่อ session — กัน loop ถ้า CDN เสิร์ฟของเก่า
                    if (sessionStorage.getItem('inandon_upd')) return;
                    sessionStorage.setItem('inandon_upd', newId);
                } catch (e) { return; }
                try {
                    var reg = navigator.serviceWorker.getRegistration();
                    if (reg && reg.then) reg.then(function (r) { if (r && r.update) r.update(); });
                } catch (e) {}
                location.reload();
            }
            fetch('./index.html?__upd=1&cb=' + Date.now(), { cache: 'no-store' })
                .then(function (r) { return r.text(); })
                .then(function (t) {
                    var m = t.match(/BUILD_ID = '([^']+)'/);
                    if (m && m[1] !== BUILD_ID) maybeReload(m[1]);
                })
                .catch(function () { /* offline — ใช้เวอร์ชันเดิมต่อได้ */ });
        })();
    </script>
</body>
</html>
