<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InAndOnBill">
    <meta name="theme-color" content="#FFFDF5">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="dns-prefetch" href="https://script.googleusercontent.com">
    <title>InAndOnBill</title>
    <style>
        /* dvh = dynamic viewport ของ iOS — กัน URL bar ทำความสูงคลาด */
        html, body {
            margin: 0; padding: 0;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            background: #FFFDF5;
            overscroll-behavior: none;
        }
        iframe {
            position: fixed;
            inset: 0;
            width: 100vw; width: 100dvw;
            height: 100vh; height: 100dvh;
            border: 0;
        }
        .boot {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 18px;
            background: #FFFDF5;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1E293B;
            z-index: 10;
        }
        .boot img { width: 96px; height: 96px; border-radius: 20px; }
        .boot .ring {
            width: 34px; height: 34px;
            border: 3px solid #F5F3FF;
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="boot" id="boot">
        <img src="icons/apple-touch-icon.png" alt="">
        <div class="ring"></div>
        <div>กำลังเชื่อมต่อระบบ...</div>
    </div>
    <iframe id="app" src="https://script.google.com/macros/s/AKfycbwrCUiqAlE8P5EJ3iJ4w2aa3AoUgZ0MWYgq8uftNCUu2-aabMWgtyLbFTSK9xnEPzRF/exec" allow="fullscreen" title="InAndOnBill"></iframe>
    <script>
        function hideBoot() {
            var boot = document.getElementById('boot');
            if (!boot || boot.dataset.hidden) return;
            boot.dataset.hidden = '1';
            boot.style.transition = 'opacity 0.3s';
            boot.style.opacity = '0';
            setTimeout(function () { boot.style.display = 'none'; }, 300);
        }
        // ยก boot ตอนที่แอปแจ้งว่า lock ขึ้นเรียบร้อยแล้ว (กันแอปแฟลชก่อน lock)
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'inandon-ready') hideBoot();
        });
        // fallback: ถ้าไม่ได้สัญญาณภายใน 12 วิ ให้เข้าแอปเดิม
        setTimeout(hideBoot, 12000);
        document.getElementById('app').addEventListener('load', function () {
            setTimeout(hideBoot, 2500);
        });
        // iframe สูงตาม innerHeight จริง + safe-area inset ที่ iOS ซ่อนไว้ท้ายจอ
        // (ใน installed PWA: innerHeight ไม่รวมโซน home indicator → nav จะลอยเหนือขอบจริง)
        var maxVH = window.innerHeight;
        var insetEl = document.createElement('div');
        insetEl.style.cssText = 'position:fixed;bottom:0;left:0;height:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none;';
        document.body.appendChild(insetEl);
        function bottomInset() {
            var h = insetEl.getBoundingClientRect().height;
            return isNaN(h) ? 0 : h;
        }
        function fitFrame() {
            maxVH = Math.max(maxVH, window.innerHeight);
            var inset = bottomInset();
            var f = document.getElementById('app');
            var total = window.innerHeight + inset;
            if (f) f.style.height = total + 'px';
            // ส่งค่า inset เข้าไปในแอป (env() ใน iframe = 0 เสมอ)
            try {
                f.contentWindow.postMessage({ type: 'inandon-safe', bottom: inset, height: total }, '*');
            } catch (e) {}
        }
        fitFrame();
        window.addEventListener('resize', function () { maxVH = Math.max(maxVH, window.innerHeight); fitFrame(); });
        window.addEventListener('orientationchange', function () { setTimeout(fitFrame, 250); });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', function () { maxVH = Math.max(maxVH, window.innerHeight); fitFrame(); });
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
