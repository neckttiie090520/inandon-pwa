<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InAndOnBill">
    <meta name="theme-color" content="#FFFDF5">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="dns-prefetch" href="https://script.googleusercontent.com">
    <title>InAndOnBill</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body { min-height: 100dvh; background: #FFFDF5; -webkit-text-size-adjust: 100%; }
        iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; border: none; }
        #bootScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #FFFDF5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 999999; font-family: system-ui, -apple-system, sans-serif; color: #1E293B; transition: opacity 0.3s; }
        #bootScreen img { width: 96px; height: 96px; border-radius: 20px; }
        #bootScreen .ring { width: 34px; height: 34px; border: 3px solid #E9E4F8; border-top-color: #8B5CF6; border-radius: 50%; animation: spin 0.9s linear infinite; }
        #bootScreen .txt { font-size: 15px; color: #64748B; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="bootScreen">
        <img src="icons/apple-touch-icon.png" alt="">
        <div class="ring"></div>
        <div class="txt">กำลังโหลด...</div>
    </div>
    <iframe id="app" src="https://script.google.com/macros/s/AKfycbwrCUiqAlE8P5EJ3iJ4w2aa3AoUgZ0MWYgq8uftNCUu2-aabMWgtyLbFTSK9xnEPzRF/exec" allow="fullscreen; web-share" style="border: none; width: 100vw; height: 100dvh; display: block; position: fixed; top: 0; left: 0; z-index: 1;"></iframe>
    <script>
        const iframe = document.getElementById('app');
        const boot = document.getElementById('bootScreen');
        let bootHidden = false;
        function hideBoot() { if (bootHidden) return; bootHidden = true; boot.style.opacity = '0'; setTimeout(function() { boot.style.display = 'none'; }, 400); }
        iframe.addEventListener('load', function() { setTimeout(hideBoot, 1000); });
        setTimeout(hideBoot, 20000);
    </script>
</body>
</html>
