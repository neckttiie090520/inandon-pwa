<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InAndOnBill">
    <meta name="theme-color" content="#FFFDF5">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="dns-prefetch" href="https://script.googleusercontent.com">
    <title>InAndOnBill</title>
    <style>
        /* dvh = dynamic viewport ของ iOS — กัน URL bar ทำความสูงคลาด */
        html, body {
            margin: 0; padding: 0;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            background: #FFFDF5;
            overscroll-behavior: none;
        }
        iframe {
            position: fixed;
            left: 0;
            width: 100vw; width: 100dvw;
            /* top/height สั่งด้วย JS — คำนวณจากความสูงแถบ Google ที่วัดสด */
            height: 100vh; height: 100dvh;
            border: 0;
        }
        .boot {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 18px;
            background: #FFFDF5;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1E293B;
            z-index: 10;
        }
        .boot img { width: 96px; height: 96px; border-radius: 20px; }
        .boot .ring {
            width: 34px; height: 34px;
            border: 3px solid #F5F3FF;
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="boot" id="boot">
        <img src="icons/apple-touch-icon.png" alt="">
        <div class="ring"></div>
        <div>กำลังเชื่อมต่อระบบ...</div>
    </div>
    <iframe id="app" allow="fullscreen" title="InAndOnBill"></iframe>
    <script>
        function hideBoot() {
            var boot = document.getElementById('boot');
            if (!boot || boot.dataset.hidden) return;
            boot.dataset.hidden = '1';
            boot.style.transition = 'opacity 0.3s';
            boot.style.opacity = '0';
            setTimeout(function () { boot.style.display = 'none'; }, 300);
        }
        // ยก boot ตอนที่แอปแจ้งว่า lock ขึ้นเรียบร้อยแล้ว (กันแอปแฟลชก่อน lock)
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'inandon-ready') hideBoot();
        });
        // fallback: ถ้าไม่ได้สัญญาณภายใน 12 วิ ให้เข้าแอปเดิม
        setTimeout(hideBoot, 12000);
        document.getElementById('app').addEventListener('load', function () {
            setTimeout(hideBoot, 2500);
        });
        // ================================================================
        // Self-measuring banner crop (แก้พื้นที่ว่างท้ายจอ)
        // หน้า GAS = ตาราง 2 แถว: แถบ "สร้างโดยผู้ใช้ Google Apps Script"
        // (บนสุด, สูงไม่คงที่) + แอปเราแถวล่าง → wrapper วัดความสูงจริง
        // จากการรายงานของแอป แล้วดัน iframe ขึ้นเหนือจอพอดีแถบ แอปจะได้
        // พื้นที่ = จอเต็ม 100% พอดีเป๊ะ ไม่ว่าแถบจะสูงเท่าไหร่
        // ================================================================
        var insetEl = document.createElement('div');
        insetEl.style.cssText = 'position:fixed;bottom:0;left:0;height:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none;';
        document.body.appendChild(insetEl);
        function bottomInset() {
            var h = insetEl.getBoundingClientRect().height;
            return isNaN(h) ? 0 : h;
        }
        var GAS_URL = 'https://script.google.com/macros/s/AKfycbwrCUiqAlE8P5EJ3iJ4w2aa3AoUgZ0MWYgq8uftNCUu2-aabMWgtyLbFTSK9xnEPzRF/exec';
        // cache-bust: ใส่ cb ใหม่ทุกครั้งที่เปิด → GAS ส่ง HTML ล่าสุดเสมอ
        var appFrame = document.getElementById('app');
        appFrame.src = GAS_URL + '?cb=' + Date.now();

        var H = window.innerHeight;   // จอจริง (top window ใน installed PWA)
        var bannerH = 0;              // ความสูงแถบ Google ที่วัดได้สด
        var assignedH = 0;            // ความสูงที่สั่ง iframe ล่าสุด

        function postToApp(msg) {
            try { appFrame.contentWindow.postMessage(msg, '*'); } catch (e) {}
        }
        function applyGeom() {
            assignedH = H + bannerH;
            appFrame.style.top = (-bannerH) + 'px';   // แถบอยู่เหนือจอหมด
            appFrame.style.height = assignedH + 'px'; // แอปได้ H พอดี
            // env() ใน iframe = 0 เสมอ → ส่ง inset + ความสูงจอจริงเข้าไป
            postToApp({ type: 'inandon-safe', bottom: bottomInset(), height: H });
        }
        // แอปรายงาน innerHeight ที่มันเห็น → bannerH = ที่สั่ง − ที่เห็น
        window.addEventListener('message', function (e) {
            var d = e.data;
            if (!d) return;
            if (d.type === 'inandon-geom' && assignedH > 0) {
                var ih = parseFloat(d.innerH) || 0;
                if (ih > 0) {
                    var b = Math.max(0, assignedH - ih);
                    // tolerance 1px กัน subpixel + clamp ≤200px กันค่าที่โดนคีย์บอร์ดเบียด
                    if (Math.abs(b - bannerH) > 1 && b <= 200) { bannerH = b; applyGeom(); }
                }
            }
            if (d.type === 'inandon-ready') hideBoot();
        });
        function fitFrame() {
            // กันบั๊ก iOS ที่ innerHeight หดค้างหลังคีย์บอร์ด/share sheet ปิด
            H = Math.max(H, window.innerHeight);
            applyGeom();
        }
        applyGeom();
        window.addEventListener('resize', fitFrame);
        window.addEventListener('orientationchange', function () {
            setTimeout(function () { H = window.innerHeight; applyGeom(); }, 250); // หมุนจอ: baseline ใหม่ตรง ๆ
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', fitFrame);
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function () {});
            });
        }
        // ================================================================
        // Auto-update check — ก่อนเข้าแอป (ยังอยู่หลัง boot screen)
        // ดึง shell ล่าสุดจากเน็ต (__upd=1 ให้ SW ข้าม cache) เทียบ BUILD_ID
        // ถ้าต่าง = อัปเดต SW + reload 1 ครั้ง (ผู้ใช้ไม่ต้องติดตั้งใหม่)
        // ================================================================
        var BUILD_ID = 'v4-20260829';
        (function () {
            if (!window.fetch) return;
            function maybeReload(newId) {
                try {
                    // reload ได้รอบเดียวต่อ session — กัน loop ถ้า CDN เสิร์ฟของเก่า
                    if (sessionStorage.getItem('inandon_upd')) return;
                    sessionStorage.setItem('inandon_upd', newId);
                } catch (e) { return; }
                try {
                    var reg = navigator.serviceWorker.getRegistration();
                    if (reg && reg.then) reg.then(function (r) { if (r && r.update) r.update(); });
                } catch (e) {}
                location.reload();
            }
            fetch('./index.html?__upd=1&cb=' + Date.now(), { cache: 'no-store' })
                .then(function (r) { return r.text(); })
                .then(function (t) {
                    var m = t.match(/BUILD_ID = '([^']+)'/);
                    if (m && m[1] !== BUILD_ID) maybeReload(m[1]);
                })
                .catch(function () { /* offline — ใช้เวอร์ชันเดิมต่อได้ */ });
        })();
    </script>
</body>
</html>
