<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PROBE — viewport test</title>
    <style>
        /* A/B probe: เขียวล้วน = พื้นที่ที่ DOM ควบคุมได้ทั้งหมด
           ถ้าเห็นแถบสีอื่น (ขาว/ดำ/ครีม) ที่ขอบใดขอบหนึ่ง = ระบบกันพื้นที่นั้นไว้ */
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #22C55E;
            overscroll-behavior: none;
        }
        .frame {
            position: fixed;
            inset: 0;
            border: 6px solid #DC2626;
            box-sizing: border-box;
            pointer-events: none;
        }
        .lbl {
            position: fixed;
            bottom: 2px;
            left: 4px;
            font: 10px/1.5 ui-monospace, Menlo, monospace;
            color: #052e16;
            background: rgba(255, 255, 255, 0.85);
            padding: 2px 6px;
            border-radius: 6px;
            z-index: 9;
        }
    </style>
</head>
<body>
    <div class="frame"></div>
    <div class="lbl" id="lbl">probe</div>
    <script>
        function safeVals() {
            var el = document.createElement('div');
            el.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
            document.body.appendChild(el);
            var cs = getComputedStyle(el);
            var r = { t: Math.round(parseFloat(cs.paddingTop) || 0), b: Math.round(parseFloat(cs.paddingBottom) || 0) };
            el.remove();
            return r;
        }
        function cssH(v) {
            var el = document.createElement('div');
            el.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:' + v + ';visibility:hidden;';
            document.body.appendChild(el);
            var h = Math.round(el.getBoundingClientRect().height);
            el.remove();
            return h;
        }
        function show() {
            var sa = safeVals();
            var ch = document.documentElement.clientHeight;
            var scr = (window.screen && screen.height) || 0;
            var vv = (window.visualViewport && Math.round(window.visualViewport.height)) || 0;
            document.getElementById('lbl').innerHTML =
                'PROBE | scr:' + scr + ' ch:' + ch + ' gap:' + (scr - ch) +
                '<br>dvh:' + cssH('100dvh') + ' vh:' + cssH('100vh') +
                ' lvh:' + cssH('100lvh') + ' vv:' + vv +
                '<br>st:' + sa.t + ' sb:' + sa.b + ' iH:' + window.innerHeight +
                ' sa:' + (navigator.standalone ? 1 : 0);
        }
        show();
        window.addEventListener('resize', show);
        setTimeout(show, 1000);
    </script>
</body>
</html>
